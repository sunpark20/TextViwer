name: voice_text_viewer
description: A voice-controlled text viewer app with speech recognition
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 음성 인식
  speech_to_text: ^7.0.0

  # 권한 처리
  permission_handler: ^11.0.0

  # 상태 관리
  provider: ^6.1.1

  # 카메라
  camera: ^0.11.0+2

  # 얼굴 감지 (ML Kit)
  google_mlkit_face_detection: ^0.11.0

  # TTS 피드백
  flutter_tts: ^4.2.0

  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
